# Activated with: --spring.profiles.active=docker  (used by docker-compose)
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:moneymate}
    username: ${DB_USER:moneymate}
    password: ${DB_PASSWORD:moneymate}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

moneymate:
  otp:
    expose-otp: false
